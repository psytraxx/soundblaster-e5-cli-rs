name: Rust

# Ignore documentation and research-only changes rather than listing the
# paths that do build, so a new source directory still gets tested by
# default instead of silently falling outside an allowlist.
#
# `reverse/` is the provenance record: captures, decompiled sources, and the
# generator for `src/proto.rs`. Nothing there is compiled -- there is no
# build.rs, and proto.rs is committed and regenerated by hand -- so editing
# it cannot break the build. Note that regenerating proto.rs *does* trigger
# CI, because the changed file lands in `src/`.
on:
  push:
    branches: ["main"]
    paths-ignore: &docs
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - "reverse/**"
      - "60-sbx-e5.rules"
  pull_request:
    branches: ["main"]
    paths-ignore: *docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # --check reports badly formatted code instead of rewriting it in the
      # runner and exiting 0, which would let unformatted code through.
      - name: Format
        run: cargo fmt --check
      # --all-targets so test and bin code is linted too, matching the
      # command CLAUDE.md tells contributors to run locally.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Run sccache stat for check
        shell: bash
        run: ${SCCACHE_PATH} --show-stats